<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index/index.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <title>Mascote Digital</title>
</head>
<body>
    <canvas id="particles"></canvas>

    <!-- Hero Section -->
    <div id="heroSection">
        <div class="hero-content">
            <div class="logo-container">
                <span class="logo-icon">🎭</span>
            </div>
            <h1 id="mainTitle">Bem-vindo ao</h1>
            <h2 id="subtitle">Mascote Digital</h2>
            <p id="heroDescription">
                Crie e cuide do seu companheiro virtual personalizado. Alimente, brinque e interaja com seu mascote em um mundo digital cheio de diversão e aventuras!
            </p>
            <div class="features">
                <div class="feature">
                    <span class="feature-icon">🐾</span>
                    <span class="feature-text">Escolha seu animal favorito</span>
                </div>
                <div class="feature">
                    <span class="feature-icon">🎭</span>
                    <span class="feature-text">Personalize a personalidade</span>
                </div>
                <div class="feature">
                    <span class="feature-icon">🎮</span>
                    <span class="feature-text">Mini-jogos interativos</span>
                </div>
                <div class="feature">
                    <span class="feature-icon">💬</span>
                    <span class="feature-text">Converse com seu mascote</span>
                </div>
            </div>
            <button id="startButton" class="start-button">
                <span class="button-icon">🚀</span>
                <span class="button-text">Iniciar Jornada</span>
            </button>
        </div>
    </div>

    <script src="index/index.js"></script>
</body>
</html>
